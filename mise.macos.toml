# mise.macos.toml — macOS（⚠️ 未在真机测试，docs/progress.md）
#
# Homebrew 由 stage-0 经清华镜像安装（lib/macos.sh）。不安装 Docker（D-005）。
# mihomo（D-028）：官方二进制（锁定版本 + sha256）装到 /opt/mihomo/bin，以 root 的 LaunchDaemon 运行，默认 TUN 模式；
#   配置渲染到 /opt/mihomo/config/config.yaml（root 0600，模板与机密同 Linux，D-008、D-027）。
#   mise 只管理用户级 LaunchAgent，LaunchDaemon 由 post-dotfiles hook（scripts/macos-mihomo-daemon.sh）加载 / 重启。
#   写入 /opt 与 /Library 需要 sudo（macOS 上通常要输入登录密码）。

[vars]
# 分流场景：desktop（国区商店直连、海外生活与开发走代理、屏蔽广告，D-027）
mihomo_profile = "desktop"
mihomo_mixed_port = "{{ env.BOOTSTRAP_MIHOMO_PORT | default(value='7890') }}"
mihomo_allow_lan = "false"
mihomo_bind_address = "127.0.0.1"
mihomo_lan_allowed_ips = "127.0.0.0/8"

[bootstrap.packages]
# eza 没有 macOS 的二进制发布，aqua 注册表要求 cargo 编译：改用 Homebrew（全局配置中的 aqua 版本在 macOS 上被排除，D-036）
"brew:eza" = "latest"

[bootstrap.secrets.mihomo_proxies]
env = "MIHOMO_PROXIES"
description = "mihomo 节点（fnox 解密；部署时输入 age 私钥）"

[bootstrap.hooks.post-packages]
description = "安装 mihomo（/opt/mihomo/bin）"
run = "sh {{ config_root }}/scripts/install-mihomo.sh"

[bootstrap.directories."/opt/mihomo"]
owner = "root"
group = "wheel"
mode = "0755"

[bootstrap.directories."/opt/mihomo/config"]
owner = "root"
group = "wheel"
mode = "0700"

[bootstrap.files."/opt/mihomo/config/config.yaml"]
source = "files/mihomo/config.yaml.tera"
template = true
owner = "root"
group = "wheel"
mode = "0600"

[bootstrap.files."/Library/LaunchDaemons/bootstrap.mihomo.plist"]
source = "files/mihomo/bootstrap.mihomo.plist"
owner = "root"
group = "wheel"
mode = "0644"

[bootstrap.hooks.post-dotfiles]
description = "加载 / 重启 mihomo 的 LaunchDaemon"
run = "sh {{ config_root }}/scripts/macos-mihomo-daemon.sh"
