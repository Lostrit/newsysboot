# fnox.toml — 机密信息（age 加密后的密文，可以安全提交；D-008）
#
# 解密：部署时把 age 私钥放进 FNOX_AGE_KEY 环境变量，用 `fnox exec -- <命令>` 注入
# 新增 / 修改：`fnox set <KEY> --from-file <文件>`，或从管道读入

[providers.age]
type = "age"
# 第 1 把：用户的 age 密钥（私钥由用户离线保管，部署新主机时注入）；第 2 把：dev 密钥库的密钥（D-042，私钥只在 dev 上）
recipients = [
  "age17ft09zwqg3kd3yvclzp6l3wejln9c8lzc5t68g39ydgv8a79tfdsyshnxq",
  "age1k79xtae5calfxnf9s42lw7kqrkcjjgmk8775lt39sdr5tczwkfdqfvjmwp",
]

[secrets]
MIHOMO_PROXIES = { provider = "age", value = "fnox-age-batch-v1::", description = "mihomo 节点（完整的 proxies: 段，插入模板第 0 列）" }
