# ~/.config/mise/config.toml — 全局工具（部署的机器都会加载）
#
# 约定（D-010）：
#   - 本文件只负责「安装工具」与工具相关的环境变量
#   - 目录由 bootstrap 的 [bootstrap.directories] 创建；工具自己需要的目录大多会按需自动创建
#   - 补全 / init 脚本由 zsh 的 $ZDOTDIR/tools.zsh 声明，启动时生成并缓存，不在 postinstall 中生成
#   - 版本全部锁定；升级 = 修改版本号并提交
#   - 这里是全部环境的工具全集；各环境不需要的由 bootstrap 写入 MISE_DISABLE_TOOLS 排除（D-036，
#     清单在 bootstrap 仓库的 lib/tool-roles.txt；工具名改动时两边一起改）

# ---------------------------------------------------------------------------
# hooks
# ---------------------------------------------------------------------------
[hooks]
# herdr 的 claude 集成：要求 claude 的目录已存在，而工具是并行安装的，所以放在全局 postinstall（全部装完之后）。
# 只在本次安装了 herdr 或 claude 时执行（MISE_INSTALLED_TOOLS 是本次安装的工具列表，JSON）
postinstall = '''
case "${MISE_INSTALLED_TOOLS:-}" in
  *herdr* | *claude*)
    if command -v herdr >/dev/null 2>&1; then
      d="${XDG_DATA_HOME:-$HOME/.local/share}/claude"
      mkdir -p "$d"
      CLAUDE_CONFIG_DIR="$d" herdr integration install claude || echo "[WARNING] herdr integration install claude failed"
    fi
    ;;
esac
'''

# ---------------------------------------------------------------------------
# env — 让工具把配置/数据/缓存放到 XDG 目录
# ---------------------------------------------------------------------------
[env]
# zsh 补全目录（供 .zshrc 引用）
ZSH_SITE_FUNCTIONS = "${XDG_DATA_HOME}/zsh/site-functions"

# node / npm
NPM_CONFIG_PREFIX = "${XDG_DATA_HOME}/npm"
NPM_CONFIG_CACHE = "${XDG_CACHE_HOME}/npm"
NPM_CONFIG_USERCONFIG = "${XDG_CONFIG_HOME}/npm/npmrc"
NODE_REPL_HISTORY = "${XDG_STATE_HOME}/node/repl_history"
NODE_COMPILE_CACHE = "${XDG_CACHE_HOME}/node"

# bun
BUN_INSTALL = "${XDG_DATA_HOME}/bun"
BUN_INSTALL_CACHE_DIR = "${XDG_CACHE_HOME}/bun/install-cache"
BUN_INSTALL_BIN = "${XDG_DATA_HOME}/bun/bin"

# bat
BAT_CONFIG_PATH = "${XDG_CONFIG_HOME}/bat/config"
BAT_CACHE_PATH = "${XDG_CACHE_HOME}/bat"

# micro
MICRO_CONFIG_HOME = "${XDG_CONFIG_HOME}/micro"
EDITOR = "micro"
VISUAL = "micro"
MICRO_TRUECOLOR = 1

# ripgrep
RIPGREP_CONFIG_PATH = "${XDG_CONFIG_HOME}/ripgrep/ripgreprc"

# eza
EZA_CONFIG_DIR = "${XDG_CONFIG_HOME}/eza"

# fzf
FZF_DEFAULT_OPTS_FILE = "${XDG_CONFIG_HOME}/fzf/fzfrc"
# catppuccin mocha theme for fzf
FZF_DEFAULT_OPTS = """\
--color=bg+:#313244,bg:#1E1E2E,spinner:#F5E0DC,hl:#F38BA8 \
--color=fg:#CDD6F4,header:#F38BA8,info:#CBA6F7,pointer:#F5E0DC \
--color=marker:#B4BEFE,fg+:#CDD6F4,prompt:#CBA6F7,hl+:#F38BA8 \
--color=selected-bg:#45475A \
--color=border:#6C7086,label:#CDD6F4"""

# jq：Catppuccin Mocha 配色（null:false:true:数字:字符串:数组:对象:键名，24 位真彩色，jq ≥ 1.7.1）
JQ_COLORS = "38;2;108;112;134:38;2;250;179;135:38;2;250;179;135:38;2;250;179;135:38;2;166;227;161:38;2;147;153;178:38;2;147;153;178:38;2;137;180;250"

# atuin
ATUIN_CONFIG_DIR = "${XDG_CONFIG_HOME}/atuin"

# tmux
TMUX_PLUGIN_MANAGER_PATH = "${XDG_DATA_HOME}/tmux/plugins"

# starship
STARSHIP_CONFIG = "${XDG_CONFIG_HOME}/starship/starship.toml"
STARSHIP_CACHE = "${XDG_CACHE_HOME}/starship"

# claude code
CLAUDE_CONFIG_DIR = "${XDG_DATA_HOME}/claude"

# ---------------------------------------------------------------------------
# runtimes
# ---------------------------------------------------------------------------

[tools.node]
version = "24.19.0"

[tools.bun]
version = "1.4.4"

# ---------------------------------------------------------------------------
# cli tools
# ---------------------------------------------------------------------------

# atuin：Linux 上用 musl 静态链接版（aqua 选的是 gnu 版，需要 glibc ≥ 2.39，Debian 12 / Ubuntu 22.04 上无法运行，P-043）；
# github 后端用 GitHub API 的 digest 校验文件；其他平台自动选择
[tools."github:atuinsh/atuin"]
version = "18.21.0"
[tools."github:atuinsh/atuin".platforms.linux-x64]
asset_pattern = "atuin-x86_64-unknown-linux-musl.tar.gz"
[tools."github:atuinsh/atuin".platforms.linux-arm64]
asset_pattern = "atuin-aarch64-unknown-linux-musl.tar.gz"

[tools."aqua:sharkdp/bat"]
version = "0.26.1"

[tools."claude"]
version = "2.1.312"

[tools."aqua:dandavison/delta"]
version = "0.19.2"

[tools."aqua:eza-community/eza"]
version = "0.23.5"

[tools."aqua:sharkdp/fd"]
version = "10.5.0"

[tools."aqua:junegunn/fzf"]
version = "0.56.3"

[tools."aqua:herdrdev/herdr"]
version = "0.9.1"

[tools."aqua:micro-editor/micro"]
version = "2.0.15"

[tools."aqua:BurntSushi/ripgrep"]
version = "15.2.0"

[tools."aqua:starship/starship"]
version = "1.26.0"

[tools."aqua:tmux/tmux-builds"]
version = "3.6a"

[tools."aqua:sharkdp/vivid"]
version = "0.11.1"

[tools."aqua:jqlang/jq"]
version = "1.8.2"

# GitHub CLI（macOS、Linux 主机）：配置遵循 XDG（~/.config/gh）；登录凭据在 hosts.yml，因此只链接 config.yml（D-037）
[tools."aqua:cli/cli"]
version = "2.103.3"

# 进程监控（Linux 主机）：musl 静态链接版；配置与主题在 ~/.config/btop（Catppuccin Mocha）
[tools."aqua:aristocratos/btop"]
version = "1.4.8"

# 机密管理（macOS、Linux 主机的日常开发；部署时用 bootstrap 仓库 mise.toml 中的同一版本，D-008、D-037）
[tools.fnox]
version = "1.43.0"

# age CLI：生成密钥（age-keygen）与临时加密文件；fnox 自带 age 加解密，不依赖它
[tools.age]
version = "1.3.2"

[tools."aqua:jesseduffield/lazygit"]
version = "0.61.1"

[tools."aqua:neovim/neovim"]
version = "0.12.2"

# tree-sitter CLI：官方 Linux 版都需要 glibc ≥ 2.39（没有 musl 版）；Debian 12 / Ubuntu 22.04 上无法运行，
# nvim 预装会跳过语法解析器并给出 WARNING（P-043）
[tools."aqua:tree-sitter/tree-sitter"]
version = "0.27.0"
# 注意：taplo / lefthook / prettier 是仅开发本仓库时需要的工具，放在仓库根目录的 mise.dev.toml 中。
