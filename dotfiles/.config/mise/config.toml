# ~/.config/mise/config.toml — 全局工具（部署的机器都会加载）
#
# 约定（D-010）：
#   - 本文件只负责「安装工具」与工具相关的环境变量
#   - 目录由 bootstrap 的 [bootstrap.directories] 创建；工具自己需要的目录大多会按需自动创建
#   - 补全 / init 脚本由 zsh 的 $ZDOTDIR/tools.zsh 声明，启动时生成并缓存，不在 postinstall 中生成
#   - 版本全部锁定；升级 = 修改版本号并提交

# ---------------------------------------------------------------------------
# hooks
# ---------------------------------------------------------------------------
[hooks]
# herdr 的 claude 集成：要求 claude 的目录已存在，而工具是并行安装的，所以放在全局 postinstall（全部装完之后）。
# 只在本次安装了 herdr 或 claude 时执行（MISE_INSTALLED_TOOLS 是本次安装的工具列表，JSON）
postinstall = '''
case "${MISE_INSTALLED_TOOLS:-}" in
  *herdr* | *claude*)
    if command -v herdr >/dev/null 2>&1; then
      d="${XDG_DATA_HOME:-$HOME/.local/share}/claude"
      mkdir -p "$d"
      CLAUDE_CONFIG_DIR="$d" herdr integration install claude || echo "[WARNING] herdr integration install claude failed"
    fi
    ;;
esac
'''

# ---------------------------------------------------------------------------
# env — 让工具把配置/数据/缓存放到 XDG 目录
# ---------------------------------------------------------------------------
[env]
# zsh 补全目录（供 .zshrc 引用）
ZSH_SITE_FUNCTIONS = "${XDG_DATA_HOME}/zsh/site-functions"

# node / npm
NPM_CONFIG_PREFIX = "${XDG_DATA_HOME}/npm"
NPM_CONFIG_CACHE = "${XDG_CACHE_HOME}/npm"
NPM_CONFIG_USERCONFIG = "${XDG_CONFIG_HOME}/npm/npmrc"
NODE_REPL_HISTORY = "${XDG_STATE_HOME}/node/repl_history"
NODE_COMPILE_CACHE = "${XDG_CACHE_HOME}/node"

# bun
BUN_INSTALL = "${XDG_DATA_HOME}/bun"
BUN_INSTALL_CACHE_DIR = "${XDG_CACHE_HOME}/bun/install-cache"
BUN_INSTALL_BIN = "${XDG_DATA_HOME}/bun/bin"

# bat
BAT_CONFIG_PATH = "${XDG_CONFIG_HOME}/bat/config"
BAT_CACHE_PATH = "${XDG_CACHE_HOME}/bat"

# micro
MICRO_CONFIG_HOME = "${XDG_CONFIG_HOME}/micro"
EDITOR = "micro"
VISUAL = "micro"
MICRO_TRUECOLOR = 1

# ripgrep
RIPGREP_CONFIG_PATH = "${XDG_CONFIG_HOME}/ripgrep/ripgreprc"

# eza
EZA_CONFIG_DIR = "${XDG_CONFIG_HOME}/eza"

# fzf
FZF_DEFAULT_OPTS_FILE = "${XDG_CONFIG_HOME}/fzf/fzfrc"
# catppuccin mocha theme for fzf
FZF_DEFAULT_OPTS = """\
--color=bg+:#313244,bg:#1E1E2E,spinner:#F5E0DC,hl:#F38BA8 \
--color=fg:#CDD6F4,header:#F38BA8,info:#CBA6F7,pointer:#F5E0DC \
--color=marker:#B4BEFE,fg+:#CDD6F4,prompt:#CBA6F7,hl+:#F38BA8 \
--color=selected-bg:#45475A \
--color=border:#6C7086,label:#CDD6F4"""

# atuin
ATUIN_CONFIG_DIR = "${XDG_CONFIG_HOME}/atuin"

# tmux
TMUX_PLUGIN_MANAGER_PATH = "${XDG_DATA_HOME}/tmux/plugins"

# starship
STARSHIP_CONFIG = "${XDG_CONFIG_HOME}/starship/starship.toml"
STARSHIP_CACHE = "${XDG_CACHE_HOME}/starship"

# claude code
CLAUDE_CONFIG_DIR = "${XDG_DATA_HOME}/claude"

# ---------------------------------------------------------------------------
# runtimes
# ---------------------------------------------------------------------------

[tools.node]
version = "24.19.0"

[tools.bun]
version = "1.4.4"

