# 本地系统（Windows、macOS）的自动测试（D-041）：仓库推送到 GitHub 时运行
#
# 能验证：工具按环境安装 / 排除、dotfiles 链接、PowerShell profile、字体、macOS 的 zsh 与 nvim 预装。
# 不能验证：国内网络（runner 在海外，直连 GitHub，不使用加速代理）、mihomo 服务（需要 age 私钥）、
# SteamOS（没有对应的 runner）。最终仍以真机验证为准（docs/verify-*.md）。
#
# macOS：用户的机器是 Intel MacBook Pro、macOS 13.7.8；GitHub 已停用 macos-13 runner（2025-12），
# 用 macos-15-intel（Intel）与 macos-latest（Apple 芯片）两种覆盖，系统版本比用户的新。
name: local-systems

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BOOTSTRAP_LOCAL: "1"
      BOOTSTRAP_NO_GH_PROXY: "1"
      BOOTSTRAP_NO_MIHOMO: "1"
      BOOTSTRAP_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - name: PowerShell 语法
        shell: pwsh
        run: ./tests/ps-parse.ps1 bootstrap.ps1 dotfiles/.config/powershell/profile.ps1 tests/ci/verify-windows.ps1
      # runner 不一定有 winget：mise 预先装好（与 vendor/mise-install.sh 同一版本，校验 sha256），bootstrap.ps1 检测到后跳过 winget
      - name: 安装 mise
        shell: pwsh
        run: |
          $v = '2026.10.22'
          $sha = 'd17239513ad4821fc73ce8c5aa9dc6a239652a59cb76fa3f003d3e6c67833b4d'
          $zip = Join-Path $env:RUNNER_TEMP 'mise.zip'
          Invoke-WebRequest "https://github.com/jdx/mise/releases/download/v$v/mise-v$v-windows-x64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw 'mise sha256 不符' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'mise')
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP 'mise\mise\bin')
      # 与用户一样在系统自带的 Windows PowerShell 5.1 中运行（以管理员身份：runner 默认即管理员）。
      # 与 irm | iex 一样按 UTF-8 读入后执行：5.1 按 ANSI 代码页读取无 BOM 的 .ps1，中文会破坏语法（P-050）。
      # 同样的原因，shell: powershell 的步骤脚本（runner 写成临时 .ps1）中只能有 ASCII 字符。
      - name: bootstrap.ps1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          try { & ([scriptblock]::Create((Get-Content -Raw -Encoding UTF8 ./bootstrap.ps1))) *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\bs-1.log" }
          catch { "ERROR: $($_ | Out-String)" | Tee-Object -FilePath "$env:RUNNER_TEMP\bs-1.log" -Append; exit 1 }
      - name: 再运行一次（幂等）
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          try { & ([scriptblock]::Create((Get-Content -Raw -Encoding UTF8 ./bootstrap.ps1))) *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\bs-2.log" }
          catch { "ERROR: $($_ | Out-String)" | Tee-Object -FilePath "$env:RUNNER_TEMP\bs-2.log" -Append; exit 1 }
      - name: 检查
        shell: pwsh
        run: ./tests/ci/verify-windows.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\bs-verify.log"; exit $LASTEXITCODE
      # 公开仓库的作业日志需要登录才能下载，注解（annotations）可以匿名读取：把各日志的末尾写成注解，便于排查
      - name: 日志末尾写成注解
        if: always()
        shell: pwsh
        run: |
          $logs = @(Get-ChildItem $env:RUNNER_TEMP -Filter 'bs-*.log' -ErrorAction SilentlyContinue)
          if (-not $logs) { Write-Host '::warning title=no logs::RUNNER_TEMP 中没有 bs-*.log' }
          # 注解消息约 4 KB 就会被截断，每个步骤每种级别最多 10 条：检查日志用 warning（末尾 120 行），
          # 部署日志用 notice（各取末尾 60 行），都按 30 行一段
          foreach ($f in $logs) {
            $verify = $f.Name -eq 'bs-verify.log'
            $level = if ($verify) { 'warning' } else { 'notice' }
            $lines = @(Get-Content $f.FullName -Tail $(if ($verify) { 120 } else { 60 }) -ErrorAction SilentlyContinue | ForEach-Object { "$_" -replace '%', '%25' -replace "`r", '' })
            for ($i = 0; $i -lt $lines.Count; $i += 30) {
              Write-Host "::$level title=$($f.Name) #$($i / 30 + 1)::$($lines[$i..([Math]::Min($i + 29, $lines.Count - 1))] -join '%0A')"
            }
          }

  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BOOTSTRAP_DIR: ${{ github.workspace }}
      BOOTSTRAP_NONINTERACTIVE: "1"
      BOOTSTRAP_SOURCE: github
      # 空值 = 用户指定直连，不测速选择加速代理
      GH_PROXY: ""
    steps:
      - uses: actions/checkout@v5
      # --dotfiles：不改系统（mihomo 的 LaunchDaemon 需要 age 私钥与登录密码，留给真机验证）
      # shell: bash 才会带 -o pipefail（默认的 bash 不带，| tee 会吞掉失败）；-x 跟踪执行，失败时能看到停在哪一步
      - name: bootstrap.sh --dotfiles
        shell: bash
        run: sh -x bootstrap.sh --dotfiles 2>&1 | tee "$RUNNER_TEMP/bs-1.log"
      - name: 再运行一次（幂等）
        shell: bash
        run: sh bootstrap.sh --dotfiles 2>&1 | tee "$RUNNER_TEMP/bs-2.log"
      # --dotfiles 不装系统软件包：单独执行 macos 模块的 packages（Homebrew 的 eza 等）
      - name: Homebrew 软件包（mise.macos.toml）
        shell: bash
        run: ~/.local/bin/mise -E macos bootstrap packages apply 2>&1 | tee "$RUNNER_TEMP/bs-3.log"
      - name: 检查
        shell: bash
        run: zsh tests/ci/verify-macos.zsh 2>&1 | tee "$RUNNER_TEMP/bs-verify.log"
      # 公开仓库的作业日志需要登录才能下载，注解（annotations）可以匿名读取：把各日志的末尾写成注解，便于排查
      - name: 日志末尾写成注解
        if: always()
        shell: bash
        run: |
          # 注解消息约 4 KB 就会被截断，每个步骤每种级别最多 10 条：检查日志用 warning（末尾 120 行），
          # 部署日志用 notice（各取末尾 60 行），都按 30 行一段（sh -x 的输出中有非 UTF-8 字节，awk 会报错，用 python）
          python3 - "$RUNNER_TEMP" <<'PY'
          import glob, os, re, sys
          logs = sorted(glob.glob(os.path.join(sys.argv[1], "bs-*.log")))
          if not logs:
              print("::warning title=no logs::RUNNER_TEMP has no bs-*.log")
          for f in logs:
              verify = os.path.basename(f) == "bs-verify.log"
              text = open(f, "rb").read().decode("utf-8", "replace")
              lines = [re.sub(r"\x1b\[[0-9;?]*[a-zA-Z]", "", l).replace("\r", "")[:160] for l in text.splitlines()[-(120 if verify else 60):]]
              for i in range(0, len(lines), 30):
                  msg = "%0A".join(l.replace("%", "%25") for l in lines[i:i + 30])
                  print(f"::{'warning' if verify else 'notice'} title={os.path.basename(f)} #{i // 30 + 1}::{msg}")
          PY
